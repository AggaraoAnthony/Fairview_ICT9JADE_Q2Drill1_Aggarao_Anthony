<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q2 Drill 1</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmCdiHbiC0A7qMZ_vFeh4aB34gOVqyalmmgUCd0LlzOy16tpIeflOgV2Q&s=10");
        background-repeat: no-repeat;
        background-size: cover;
      }
    </style>
  </head>
  <body class="mt-5">
    <main>
      <header class="container bg-warning shadow rounded-3">
        <h1 class="p-2 text-center m-3">Beginner Guide to Volleyball</h1>
      </header>
    </main>

    <!-- img -->
    <img
      class="rounded-circle mt-4 d-block m-auto"
      src="https://i.pinimg.com/736x/92/da/55/92da55a079e6e91aef207a1f9a02d8f7.jpg"
      alt="Volleyball"
      style="height: 150px"
    />

    <div class="row mx-3 my-3 justify-content-center">
      <div class="col-12 col-lg-4">
        <div class="card shadow">
          <div class="card-body">
            <h2>
              <div class="bg-success rounded-2 p-1 text-center">Equipment</div>
            </h2>

            <ul>
              <li>Jersy</li>
              <li>Shorts</li>
              <li>Protection/Kneepads</li>
              <li>Water</li>
            </ul>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-4">
        <div class="card shadow">
          <div class="card-body">
            <h2>
              <div class="bg-success rounded-2 p-1 text-center">
                Basic Rules
              </div>
            </h2>

            <ul>
              <li>Double Touch</li>
              <li>Out of Bounds</li>
              <li>4 Touches</li>
              <li>Net Touch</li>
            </ul>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-4">
        <div class="card shadow">
          <div class="card-body">
            <h2>
              <div class="bg-success rounded-2 p-1 text-center">
                Basic Technique
              </div>
            </h2>

            <ul>
              <li>Stay Low</li>
              <li>Hustle</li>
              <li>Block by Jumping</li>
              <li>Recieve the ball by using legs</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
